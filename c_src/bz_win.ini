; bz_win.ini - settings for bz_win.exe (Battlezone C port, M7 playable build).
; Lives next to the exe.  The exe reads every key at start and writes back the
; value that took effect (an unknown/missing key reappears with its default).
; See NOTES_platform.md.
;
; Keys (all hard-coded, not rebindable - MAME's Battlezone defaults):
;   left tread:  E forward, D reverse
;   right tread: I forward, K reverse
;   single-stick mode (arrows, ORed with the tread keys above):
;     Up = both forward, Down = both reverse,
;     Left = left reverse + right forward (pivot left),
;     Right = left forward + right reverse (pivot right),
;     Up+Left = right forward only, Up+Right = left forward only,
;     Down+Left = left reverse only, Down+Right = right reverse only
;   fire: Space or Left Ctrl        start1: 1        start2: 2
;   coin1: 5        coin2: 6
;   self-test switch: F2 (a latched toggle; switching it ON resets the board)
;   diag step: F1   reset: F3       slam: F4
;   Alt+Enter: fullscreen           Esc: quit
; Joystick/gamepad: left stick Y = left tread, right stick Y ("Ry") = right
; tread, d-pad = single-stick mode, button 1 = fire, Start = start1,
; Back/Select = coin1.

[dips]
; Option switches, one word per group (AAE's bzone defaults shown first).
; An unknown word falls back to the default and is rewritten.
; lives:       3 | 2 | 4 | 5
; missile_at:  10000 | 5000 | 20000 | 30000   (score the missile appears at)
; bonus_tank:  15k_and_100k | 20k_and_100k | 50k_and_100k | none
; language:    english | german | french | spanish
; coinage:     1_coin_1_play | 2_coins_1_play | 1_coin_2_plays | free_play
; right_coin:  x1 | x4 | x5 | x6        left_coin: x1 | x2
; bonus_coins: none | 3_credits_2_coins | 5_credits_4_coins |
;              6_credits_4_coins | 6_credits_5_coins
lives=3
missile_at=10000
bonus_tank=15k_and_100k
language=english
coinage=1_coin_1_play
right_coin=x1
left_coin=x1
bonus_coins=none

[main]
; vsync: 0 = off (default): each picture is swapped the moment it is
; presented, never blocking the game clock (the tested default).  1 = on,
; 2 = adaptive - a swap can wait for the display's refresh, which may add a
; little jitter to the NMI-driven pacing (see plat_win.c present_idle).
vsync=0
; refresh_hz: 0 = ask Windows for the monitor's rate (vsync=1 timing, phosphor redraws)
refresh_hz=0.000000
test_switch=0


[vector]
; phosphor_ms: afterglow time constant in ms, 0 = off (the newest picture only)
phosphor_ms=0.000000
; linewidth: beam width in pixels at the default (tube-span-wide) window
linewidth=2.000000
; gain: 0..255 brightness lift added to every beam
gain=0
; line_smoothing: anti-aliasing feather in physical pixels
line_smoothing=1.000000
; corner_strength: round join size at corners, x half-width
corner_strength=1.000000
fire_point_size=10.000000

[sound]
; pokey_volume: 0 = no audio device opened (the core still clocks the chips,
; just pushes nothing); 1..100 = XAudio2 stream volume
pokey_volume=100
; latency_blocks: audio stream priming depth, 1..8
latency_blocks=6
samples_volume=100

[joystick]
; deadzone: radial deadzone for the main (left) stick, in stick units (0..126)
deadzone=19
[samples]
; dir: relative to the exe's folder (c_src\samples\, the MAME wavs)
dir=samples
fire1=FIRE.WAV
fire2=FIRE2.WAV
engine1=ENGINE1.WAV
engine2=ENGINE2.WAV
explode1=EXPLODE1.WAV
explode2=EXPLODE2.WAV
