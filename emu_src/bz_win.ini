; bz_win.ini - settings for bz_emu.exe (the real Battlezone ROM on a 6502).
; The file name is the Windows backend's (c_src\platform\windows\plat_win.c,
; shared unchanged with bz_win.exe); this copy lives next to bz_emu.exe in
; emu_src\, so the two programs never share settings or log.  Every key means
; what it means in ..\c_src\bz_win.ini - see the comments there; the exe
; writes back the value that took effect.  The only key of the emulator's own
; is [main] roms.
;
; Keys: E/D left tread, I/K right tread, arrows single-stick, Space/Ctrl fire,
; 1/2 start, 5/6 coin, F2 self-test switch (switching it ON resets the board),
; F1 diag step, F3 reset, F4 slam, Alt+Enter fullscreen, Esc quit.

[dips]
; Option switches, one word per group (AAE's bzone defaults shown first).
; An unknown word falls back to the default and is rewritten.
; lives:       3 | 2 | 4 | 5
; missile_at:  10000 | 5000 | 20000 | 30000   (score the missile appears at)
; bonus_tank:  15k_and_100k | 20k_and_100k | 50k_and_100k | none
; language:    english | german | french | spanish
; coinage:     1_coin_1_play | 2_coins_1_play | 1_coin_2_plays | free_play
; right_coin:  x1 | x4 | x5 | x6        left_coin: x1 | x2
; bonus_coins: none | 3_credits_2_coins | 5_credits_4_coins |
;              6_credits_4_coins | 6_credits_5_coins
lives=3
missile_at=10000
bonus_tank=15k_and_100k
language=english
coinage=1_coin_1_play
right_coin=x1
left_coin=x1
bonus_coins=none

[main]
vsync=0
refresh_hz=0.000000
test_switch=0
; roms: the MAME Battlezone zip to load (bzone, bzonea, or the old-name
; bzone2 / bzone layouts).  Empty = roms\bzone.zip beside the exe
; (emu_src\roms\).  --roms FILE on the command line wins over this key.
roms=

[vector]
phosphor_ms=0.000000
linewidth=2.000000
gain=0
line_smoothing=1.000000
corner_strength=1.000000
fire_point_size=10.000000

[sound]
pokey_volume=100
latency_blocks=6
samples_volume=100

[joystick]
deadzone=19

[samples]
; dir: relative to the exe's folder (emu_src\samples\, the MAME wavs)
dir=samples
fire1=FIRE.WAV
fire2=FIRE2.WAV
engine1=ENGINE1.WAV
engine2=ENGINE2.WAV
explode1=EXPLODE1.WAV
explode2=EXPLODE2.WAV
